
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Record Verification</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f5f7;color:#222;font-family:Arial,sans-serif}
header{background:#183153;color:white;padding:22px;text-align:center}
main{max-width:1100px;margin:24px auto;padding:0 15px}
.notice{background:#fff3cd;border:1px solid #e5ca79;padding:13px;margin-bottom:18px;line-height:1.5}
.panel{background:white;border:1px solid #ddd;padding:22px;border-radius:7px}
h2{font-size:19px;margin-top:24px;border-bottom:2px solid #9b4545;padding-bottom:9px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 20px}
.item{padding:12px 8px;border-bottom:1px solid #ddd;overflow-wrap:anywhere;line-height:1.45}
.label{font-size:12px;color:#555;font-weight:bold;margin-bottom:5px}
.value{font-size:15px;white-space:pre-wrap}
.status{text-align:center;padding:28px;background:white;border:1px solid #ddd;border-radius:7px}
footer{text-align:center;color:#666;font-size:12px;margin:22px}
@media(max-width:650px){.grid{grid-template-columns:1fr}.panel{padding:14px}}
</style>
</head>
<body>
<header>
<h1>Record Verification</h1>
<p>Record details provided with this QR link</p>
</header>
<main>
<div class="notice">
<strong>Private record display.</strong>
This page displays information carried in the QR URL.
It does not independently authenticate the record or confirm
that it was issued by a government authority.
</div>
<div id="result" class="status">Reading record details…</div>
</main>
<footer>Private record display</footer>
<script>
(function(){
const labels=[
["recordNumber","1. eForm-C No."],
["licenseeId","2. Licensee ID"],
["licenseeName","3. Name of Licensee"],
["licenseeMobile","4. Mobile Number of Licensee"],
["licenseeDetails","5. Licensee Details [Address, Village, Gata/Khand, Area]"],
["tehsil","6. Tehsil of License"],
["district","7. District of License"],
["quantity","8. Quantity Transported (Cubic Meter / Ton)"],
["mineral","9. Name of Mineral"],
["loadingFrom","10. Loading From"],
["destination","11. Destination (Delivery Address)"],
["distance","12. Distance (Approx. in KM)"],
["generatedOn","13. Record Generated On"],
["validUpto","14. Record Valid Until"],
["destinationDistrict","15. Destination District"],
["duration","16. Travelling Duration"],
["sellingPrice","17. Selling Price (Rs)"],
["serialNumber","18. Serial Number"],
["vehicleRegistration","1. Registration Number"],
["vehicleType","2. Type of Vehicle"],
["driverName","3. Name of Driver"],
["driverMobile","4. Mobile Number of Driver"],
["driverDL","5. DL Number of Driver"]
];

const params=new URLSearchParams(window.location.search);
const raw=params.get("record");
const result=document.getElementById("result");

function addItem(grid,label,value){
 const item=document.createElement("div");
 item.className="item";
 const l=document.createElement("div");
 l.className="label";
 l.textContent=label;
 const v=document.createElement("div");
 v.className="value";
 v.textContent=(value===undefined||value===null||value==="")?"—":String(value);
 item.append(l,v);
 grid.append(item);
}

if(!raw){
 result.textContent="No record data was found in this URL. Please scan a QR code generated by the updated generator.";
 return;
}

let record;
try{
 record=JSON.parse(raw);
 if(!record||typeof record!=="object"||Array.isArray(record)){
  throw new Error("Invalid record");
 }
}catch(error){
 result.textContent="The record data in this URL could not be read. Please generate a new QR code and try again.";
 return;
}

result.className="panel";
const heading=document.createElement("h2");
heading.textContent="Record Details";
result.append(heading);

const grid=document.createElement("div");
grid.className="grid";
labels.slice(0,18).forEach(([key,label])=>addItem(grid,label,record[key]));
result.append(grid);

const vehicleHeading=document.createElement("h2");
vehicleHeading.textContent="Details of Registered Vehicle";
result.append(vehicleHeading);

const vehicleGrid=document.createElement("div");
vehicleGrid.className="grid";
labels.slice(18).forEach(([key,label])=>addItem(vehicleGrid,label,record[key]));
result.append(vehicleGrid);

const note=document.createElement("div");
note.className="notice";
note.style.marginTop="20px";
note.textContent="This page displays the data embedded in the QR URL. It is not a live database lookup and does not independently verify authenticity.";
result.append(note);
})();
</script>
</body>
</html>
